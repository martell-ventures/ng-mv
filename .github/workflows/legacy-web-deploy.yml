# Deploys this site to the legacy-web dev environment (martell-ventures/shared_infra).
name: Deploy (legacy-web)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    uses: martell-ventures/shared_infra/.github/workflows/site-deploy.yml@main
    with:
      site: ng-mv
      env: dev
    permissions:
      id-token: write
      contents: read
